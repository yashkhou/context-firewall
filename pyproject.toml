[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-firewall"
version = "0.1.0"
description = "Provenance-aware trust boundaries for agent context before it reaches privileged tool or system sinks."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "yashkhou"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
